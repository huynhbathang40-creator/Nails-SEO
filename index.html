<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlowBack – More Google Reviews for Nail Salons | $49/mo</title>
    <meta name="description" content="Get more 5-star Google reviews and bring past clients back automatically. Built for nail salons. English &amp; Vietnamese. $49/month, no contract. Try it free." />
    <meta property="og:title" content="GlowBack – More Google Reviews for Nail Salons" />
    <meta property="og:description" content="More stars. More regulars. Fuller Tuesdays. $49/month, no contract." />
    <meta name="theme-color" content="#5B2A86" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Netlify Forms reads these hidden forms at deploy time so it knows which
      fields to accept. The React app submits to them with fetch (src/lib/forms.js).
      Keep the field names here in sync with the app.
    -->
    <form name="trial" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="salon" /><input name="name" /><input name="phone" /><input name="email" />
      <input name="city" /><input name="stations" /><input name="app" /><input name="language" />
      <input name="consent" /><input name="bot-field" />
    </form>
    <form name="demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="salon" /><input name="phone" /><input name="time" />
      <input name="language" /><input name="bot-field" />
    </form>
    <form name="results" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="phone" /><input name="monthly" /><input name="clients" />
      <input name="spend" /><input name="lapsed" /><input name="visits" /><input name="bot-field" />
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="contact" /><input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
